# Render Blueprint for the API. The database is Neon Postgres (set SHETU_DATABASE_URL);
# the web app is deployed on Vercel. See docs/deployment.md.
services:
  - type: web
    name: shetu-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SHETU_ENVIRONMENT
        value: production
      - key: SHETU_DATABASE_URL
        sync: false
      - key: SHETU_CORS_ORIGINS
        value: '["https://shetu-congress.vercel.app","https://shetu-delta.vercel.app","http://localhost:3000"]'
      - key: SHETU_AI_PROVIDER
        value: groq
      - key: SHETU_AI_FALLBACK
        value: gemini
      - key: SHETU_GROQ_API_KEY
        sync: false
      - key: SHETU_GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: SHETU_GEMINI_API_KEY
        sync: false
      - key: SHETU_GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SHETU_ANTHROPIC_API_KEY
        sync: false
